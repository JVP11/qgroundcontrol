<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d0d1a; overflow:hidden; }
canvas { display:block; }
#hud {
  position:absolute; top:12px; left:12px;
  font:11px/1.6 monospace; color:#9FE1CB;
  pointer-events:none;
}
#close-btn {
  position:absolute; top:12px; right:12px;
  background:#712B13; color:white; border:none;
  padding:6px 14px; border-radius:4px; cursor:pointer;
  font-size:12px;
}
</style>
</head>
<body>
<div id="hud"></div>
<button id="close-btn" onclick="closeView()">Close 3D</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Scene setup ────────────────────────────────────────────────────────
const W = window.innerWidth, H = window.innerHeight
const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setSize(W, H)
renderer.setPixelRatio(window.devicePixelRatio)
renderer.shadowMap.enabled = true
document.body.appendChild(renderer.domElement)

const scene = new THREE.Scene()
scene.background = new THREE.Color(0x0d0d1a)
scene.fog = new THREE.Fog(0x0d0d1a, 20, 40)

const camera = new THREE.PerspectiveCamera(55, W/H, 0.1, 100)
camera.position.set(0, 8, 10)
camera.lookAt(0, 0, 0)

// ── Lights ─────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x334466, 1.0))
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6)
dirLight.position.set(5, 10, 5)
scene.add(dirLight)

// ── Room geometry ──────────────────────────────────────────────────────
const ROOM_W = 12, ROOM_H = 9, ROOM_ALT = 3.5

// Floor
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(ROOM_W, ROOM_H),
  new THREE.MeshLambertMaterial({ color: 0x1a1a3a, side: THREE.DoubleSide })
)
floor.rotation.x = -Math.PI/2
scene.add(floor)

// Grid
const grid = new THREE.GridHelper(Math.max(ROOM_W, ROOM_H), Math.max(ROOM_W, ROOM_H),
  0x334466, 0x222244)
scene.add(grid)

// Walls (wireframe)
const wallMat = new THREE.MeshBasicMaterial({ color: 0x334466, wireframe: true, opacity:0.2, transparent:true })
const wallGeo = new THREE.BoxGeometry(ROOM_W, ROOM_ALT, ROOM_H)
const walls = new THREE.Mesh(wallGeo, wallMat)
walls.position.y = ROOM_ALT / 2
scene.add(walls)

// ── Drone objects ──────────────────────────────────────────────────────
const DRONE_COLORS = [0x1D9E75, 0x7F77DD, 0x378ADD, 0xEF9F27, 0xE24B4A]
const COLLISION_COLOR = 0xE24B4A
const SAFE_COLOR      = 0x1D9E7533

const droneMeshes   = {}   // sysid → { body, bubble, trail, label }
const trailPoints   = {}   // sysid → THREE.Vector3[]

function getOrCreateDrone(sysid) {
  if (droneMeshes[sysid]) return droneMeshes[sysid]

  const color = DRONE_COLORS[(sysid - 1) % DRONE_COLORS.length]

  // Body: cone (pointing forward) + small box (body)
  const group = new THREE.Group()

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.12, 0.06, 8),
    new THREE.MeshLambertMaterial({ color })
  )
  group.add(body)

  // Rotor discs
  for (let i = 0; i < 4; i++) {
    const rotor = new THREE.Mesh(
      new THREE.CylinderGeometry(0.15, 0.15, 0.01, 12),
      new THREE.MeshLambertMaterial({ color: 0xaaaaaa, transparent:true, opacity:0.5 })
    )
    rotor.position.set(
      Math.cos(i*Math.PI/2)*0.22,
      0.04,
      Math.sin(i*Math.PI/2)*0.22
    )
    group.add(rotor)
  }

  // Heading arrow (thin box)
  const arrow = new THREE.Mesh(
    new THREE.BoxGeometry(0.04, 0.02, 0.2),
    new THREE.MeshLambertMaterial({ color: 0xffffff })
  )
  arrow.position.z = -0.18
  group.add(arrow)

  // Collision bubble (sphere, transparent)
  const bubble = new THREE.Mesh(
    new THREE.SphereGeometry(1.5, 16, 12),
    new THREE.MeshBasicMaterial({
      color: SAFE_COLOR, transparent:true, opacity:0.08, wireframe:false
    })
  )
  const bubbleWire = new THREE.Mesh(
    new THREE.SphereGeometry(1.5, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0x1D9E75, wireframe:true, opacity:0.12, transparent:true })
  )
  scene.add(bubble)
  scene.add(bubbleWire)

  // Trail line
  const trailGeo = new THREE.BufferGeometry()
  const trailMat = new THREE.LineBasicMaterial({ color, opacity:0.4, transparent:true })
  const trail = new THREE.Line(trailGeo, trailMat)
  scene.add(trail)
  trailPoints[sysid] = []

  scene.add(group)
  droneMeshes[sysid] = { group, body, bubble, bubbleWire, trail, trailGeo }
  return droneMeshes[sysid]
}

// ── State update (called by QGC WebChannel or polling) ────────────────
function updateDrones(stateArray) {
  const hud = document.getElementById('hud')
  let hudLines = []

  stateArray.forEach(function(d) {
    const obj = getOrCreateDrone(d.sysid)

    // NED → Three.js: x=right(y-ned), y=up(-z-ned), z=back(-x-ned)
    const tx =  d.y
    const ty = -d.z
    const tz = -d.x

    obj.group.position.set(tx, ty, tz)
    obj.group.rotation.y = -d.yaw   // yaw around up axis

    obj.bubble.position.set(tx, ty, tz)
    obj.bubbleWire.position.set(tx, ty, tz)

    // Collision color
    const warn = d.collision_warning
    obj.bubble.material.color.setHex(warn ? 0xE24B4A33 : 0x1D9E7533)
    obj.bubbleWire.material.color.setHex(warn ? COLLISION_COLOR : 0x1D9E75)

    // Trail: push point, keep last 80
    trailPoints[d.sysid].push(new THREE.Vector3(tx, ty, tz))
    if (trailPoints[d.sysid].length > 80) trailPoints[d.sysid].shift()
    obj.trailGeo.setFromPoints(trailPoints[d.sysid])

    // HUD line
    hudLines.push(`D${d.sysid}  x${d.x.toFixed(1)} y${d.y.toFixed(1)} z${(-d.z).toFixed(1)}m  ${d.armed?'ARMED':'disarm'}  ${d.battery_pct}%${warn?' ⚠':''}`)
  })

  hud.innerText = hudLines.join('\n')
}

// ── Orbit controls (manual, no import needed) ─────────────────────────
let isDragging = false, prevMouse = {x:0,y:0}
let spherical = {theta:0.3, phi:0.8, r:14}

function updateCamera() {
  camera.position.set(
    spherical.r * Math.sin(spherical.phi) * Math.sin(spherical.theta),
    spherical.r * Math.cos(spherical.phi),
    spherical.r * Math.sin(spherical.phi) * Math.cos(spherical.theta)
  )
  camera.lookAt(0, 1, 0)
}
updateCamera()

renderer.domElement.addEventListener('mousedown', e => { isDragging=true; prevMouse={x:e.clientX,y:e.clientY} })
window.addEventListener('mouseup', () => isDragging=false)
window.addEventListener('mousemove', e => {
  if (!isDragging) return
  spherical.theta -= (e.clientX - prevMouse.x) * 0.008
  spherical.phi    = Math.max(0.1, Math.min(Math.PI/2-0.05,
                     spherical.phi - (e.clientY - prevMouse.y) * 0.008))
  prevMouse = {x:e.clientX, y:e.clientY}
  updateCamera()
})
renderer.domElement.addEventListener('wheel', e => {
  spherical.r = Math.max(3, Math.min(25, spherical.r + e.deltaY * 0.01))
  updateCamera()
})

// ── Render loop ────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate)
  renderer.render(scene, camera)
}
animate()

// ── QGC WebChannel bridge ──────────────────────────────────────────────
// QGC's C++ side calls: page.runJavaScript("updateDrones(" + json + ")")
// No extra setup needed — updateDrones is a global.

// ── Mock data for dev (remove when wired to QGC) ───────────────────────
;(function mockLoop() {
  const t = Date.now() / 1000
  updateDrones([
    {sysid:1, x: 2*Math.cos(t*0.3),    y: 2*Math.sin(t*0.3),    z:-1.5, yaw:t*0.3,    armed:true,  battery_pct:82, collision_warning:false},
    {sysid:2, x: 2*Math.cos(t*0.3+2.1),y: 2*Math.sin(t*0.3+2.1),z:-1.5, yaw:t*0.3+2.1,armed:true,  battery_pct:61, collision_warning:false},
    {sysid:3, x: 2*Math.cos(t*0.3+4.2),y: 2*Math.sin(t*0.3+4.2),z:-1.5, yaw:t*0.3+4.2,armed:false, battery_pct:95, collision_warning:false},
  ])
  setTimeout(mockLoop, 100)
})()

// ── Close handler ──────────────────────────────────────────────────────
function closeView() {
  // Post message to QGC Qt WebChannel
  if (window.qt && window.qt.webChannelTransport) {
    new QWebChannel(qt.webChannelTransport, function(ch) {
      ch.objects.swarmBridge.close3DView()
    })
  } else {
    window.history.back()
  }
}
</script>
</body>
</html>
